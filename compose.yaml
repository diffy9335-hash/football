services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/football.sqlite3
    volumes:
      - football_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 20s
  bot:
    build: .
    restart: unless-stopped
    command: python -m app.bot
    env_file: .env
    environment:
      DB_PATH: /data/football.sqlite3
    volumes:
      - football_data:/data
    depends_on:
      api:
        condition: service_healthy
  backup:
    build: .
    restart: unless-stopped
    command: python -m app.operations
    env_file: .env
    environment:
      DB_PATH: /data/football.sqlite3
      BACKUP_DIR: /backups
    volumes:
      - football_data:/data:ro
      - football_backups:/backups
    depends_on:
      api:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  football_data:
  football_backups:
  caddy_data:
  caddy_config:
